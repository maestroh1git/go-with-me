# Air live-reload config for local development.
# Install: go install github.com/air-verse/air@latest
# Run: air -c .air.toml  (or: make dev)

root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
entrypoint = "./tmp/server"
delay = 300
include_ext = ["go", "yaml", "yml", "env"]
include_dir = ["internal", "cmd", "migrations"]
exclude_dir = ["tmp", "vendor", ".git", ".github", "bin", "internal/repository/sqlc"]
exclude_regex = ["_test\\.go"]
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
